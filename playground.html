<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101210">
  <meta name="description" content="Write, organize, and run Lunex projects in your browser.">
  <title>Lunex Playground</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="vendor/codemirror/theme/material-darker.css">
  <link rel="stylesheet" href="vendor/codemirror/addon/hint/show-hint.css">
  <link rel="stylesheet" href="playground-ide.css">
</head>
<body id="top" class="ide-page">
  <header class="site-header ide-header">
    <div class="header-inner ide-header-inner">
      <a class="brand ide-brand" href="index.html" aria-label="Lunex home"><span class="brand-mark" aria-hidden="true">lx</span><span class="brand-name">lunex<span class="brand-period">.</span></span><span class="ide-label">PLAYGROUND</span></a>
      <div class="header-actions ide-header-actions">
        <span class="ide-cloud-state"><span class="status-dot"></span><span id="saveStatus">Saved in this browser</span></span>
        <button class="menu-button" id="menuButton" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="menuPanel"><span></span><span></span><span></span></button>
      </div>
      <nav class="menu-panel" id="menuPanel" aria-label="Main navigation" hidden>
        <a href="index.html">Home</a>
        <a href="releases.html">Releases</a>
        <a href="docs.html">Documentation</a>
        <a href="playground.html">Playground</a>
        <a href="https://github.com/Megamexlevi2/lunex-language" target="_blank" rel="noreferrer">Source code ↗</a>
        <a href="downloads/lunex-language.vsix" download>Download VS Code extension</a>
      </nav>
    </div>
  </header>
  <main class="ide-app" id="ideApp">
    <div class="ide-toolbar">
      <div class="toolbar-group toolbar-workspace">
        <button class="icon-button mobile-sidebar-button" id="toggleSidebar" type="button" aria-label="Toggle file explorer" title="File explorer">☰</button>
        <span class="workspace-indicator"><span class="workspace-mark">lx</span><span id="workspaceName">Lunex Project</span></span>
        <span class="toolbar-separator"></span>
        <button class="toolbar-button" id="newFile" type="button" title="Create a file">＋ New file</button>
        <button class="toolbar-button" id="openFiles" type="button" title="Open files from your device">Open files</button>
        <button class="toolbar-button folder-open-button" id="openFolder" type="button" title="Open a folder from your device">Open folder</button>
      </div>
      <div class="toolbar-group toolbar-actions">
        <button class="toolbar-button" id="downloadFile" type="button" title="Download current file">↓ File</button>
        <button class="toolbar-button" id="exportProject" type="button" title="Download all workspace files as a ZIP archive">↓ Project</button>
        <button class="run-button" id="runCode" type="button" title="Run current Lunex file"><span class="play-triangle">▶</span><span>Run</span><kbd>Ctrl ↵</kbd></button>
      </div>
      <input id="filePicker" type="file" multiple hidden>
      <input id="folderPicker" type="file" webkitdirectory directory multiple hidden>
    </div>
    <div class="ide-workbench" id="ideWorkbench">
      <aside class="file-explorer" id="fileExplorer" aria-label="Project files">
        <div class="panel-title"><span>EXPLORER</span><div class="panel-title-actions"><button id="explorerNewFile" type="button" aria-label="New file" title="New file">＋</button><button id="refreshFiles" type="button" aria-label="Refresh files" title="Refresh">↻</button></div></div>
        <button class="project-heading" id="projectHeading" type="button" aria-label="Project files"><span class="folder-chevron">⌄</span><span id="projectTitle">LUNEX PROJECT</span></button>
        <div class="file-list" id="fileList"></div>
        <div class="explorer-footer"><span class="tiny-dot"></span><span id="fileCount">2 files</span><span class="explorer-spacer"></span><button id="clearWorkspace" type="button" title="Clear workspace" aria-label="Clear workspace">×</button></div>
      </aside>
      <section class="editor-stage" aria-label="Code editor">
        <div class="tab-strip" id="tabStrip" role="tablist" aria-label="Open files"></div>
        <div class="editor-toolbar">
          <div class="breadcrumbs" id="breadcrumbs"><span class="crumb-muted">workspace</span><span class="crumb-divider">›</span><span>main.lx</span></div>
          <div class="editor-toolbar-actions"><button id="commandPalette" type="button" title="Quick actions · Ctrl Shift P">⌘ <span>Quick actions</span></button><button id="toggleFullscreen" type="button" title="Toggle browser fullscreen" aria-label="Toggle fullscreen">⛶</button></div>
        </div>
        <div class="editor-host" id="editorHost"><div id="editorMount"></div><div class="editor-hover" id="editorHover" hidden></div></div>
        <div class="editor-statusline"><span class="status-language"><span class="language-mark">lx</span>Lunex</span><span id="cursorStatus">Ln 1, Col 1</span><span>UTF-8</span><span>Spaces: 2</span><span class="editor-status-spacer"></span><span id="editorFileStatus">main.lx</span></div>
      </section>
    </div>
    <section class="bottom-panel" id="bottomPanel" aria-label="Program output">
      <div class="bottom-panel-header">
        <div class="bottom-tabs" role="tablist" aria-label="Program output"><button class="bottom-tab is-active" data-panel="output" type="button" role="tab" aria-selected="true">OUTPUT</button></div>
        <div class="bottom-panel-actions"><button id="clearPanel" type="button" title="Clear panel">Clear</button><button id="hideBottomPanel" type="button" title="Hide panel" aria-label="Hide panel">⌄</button></div>
      </div>
      <div class="panel-view is-active" id="outputView" role="tabpanel"><div class="output-placeholder">Run a Lunex file to see its output here.</div></div>
    </section>
    <button class="panel-reopen" id="showBottomPanel" type="button" hidden>Show panel ↑</button>
  </main>
  <div class="command-overlay" id="commandOverlay" hidden>
    <div class="command-box" role="dialog" aria-modal="true" aria-label="Quick actions"><div class="command-search-row"><span>⌕</span><input id="commandSearch" type="text" autocomplete="off" placeholder="Search actions…"><button id="closeCommandPalette" type="button" aria-label="Close command palette">Esc</button></div><div class="command-list" id="commandList"></div></div>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
  <script type="module" src="playground.js"></script>
</body>
</html>
